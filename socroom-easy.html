  function renderMap(){const stats=E.stats(progress,progress.currentLevel),next=E.getMission(recommended());$('app').innerHTML=header()+`<main class="map-page" id="main"><section class="hero"><div class="hero-copy"><p class="eyebrow">STEP BY STEP INTO SECURITY</p><h1>小さな発見から、<br><span>SOCへ。</span></h1><p class="lead">ログを読めなくても、ここから。<br>初級・中級・上級の63問で、<br class="mobile">読む・つなぐ・判断する力を育てよう。</p><div class="hero-badges"><span>時間制限なし</span><span>間違えても減点なし</span><span>ブラウザだけで完結</span></div><button class="btn primary hero-start" data-open="${next.id}">${stats.completed===stats.total?level().title+'の卒業調査を振り返る':stats.completed?level().title+'の続きから練習する':level().id==='beginner'?'最初のログを読んでみる':level().title+'の練習を始める'} ${icon('arrow')}</button><p class="start-caption">${esc(level().title)} · ${esc(next.title)} · ${missionIndex(next)} / ${stats.total}</p></div><div class="hero-art" aria-label="ログの中から小さな手がかりを見つける練習"><div class="art-grid" aria-hidden="true"></div><div class="floating-label">FIND YOUR FIRST FLAG ${icon('flag')}</div><div class="mini-log"><div class="mini-log-head"><i></i><i></i><i></i><span>はじめてのログ</span></div><code><span class="log-comment">// システムが残した記録</span><br><span class="art-field">09:12:30</span> <span class="art-field">user=mei</span><br><span class="art-target">result=success</span></code><div class="art-note">success は「成功」<br><strong>まずは、この1つが読めればOK。</strong></div></div><div class="art-ticket">${icon('check')}小さな「わかった」を集めよう。</div></div></section>

  function highlight(text,query){

      for(const character of folded){
        if(/\s/.test(character)){
          if(!mapped)continue;
          if(mapped.endsWith(' ')){ends[ends.length-1]=index+segment.length;continue;}
          mapped+=' ';starts.push(index);ends.push(index+segment.length);

      }

    return result+esc(value.slice(cursor));
  }
  function sourceCard(row,index,selectable=false){const input=record().input,chosen=(input.rowIds||[]).includes(row.id),query=step().kind==='filter'?input.query||'':'';const isReference=Boolean(row.sourceType&&row.sourceType!=='log');const content=isReference?`<div class="source-kind">${row.sourceType==='reply'?'担当者の回答':'参照する資料'}</div><h3>${esc(row.title||'確認資料')}</h3><p class="reference-body">${esc(row.body||'')}</p>`:`<div class="source-kind">記録 ${String(index+1).padStart(2,'0')}${row.event?`<span>${esc(row.event)}</span>`:''}</div>${row.title?`<h3>${esc(row.title)}</h3>`:''}<pre class="raw-log">${highlight(row.raw||row.body||'',query)}</pre>${row.note?`<p class="row-note">${esc(row.note)}</p>`:''}`;return `<article class="source-card ${chosen?'selected':''}" data-row="${esc(row.id)}">${content}${selectable?`<button class="row-select" data-select="${esc(row.id)}" aria-pressed="${chosen}" ${locked()?'disabled':''}>${icon(chosen?'check':'flag')}${chosen?'選択済み':'この記録を選ぶ'}</button>`:''}</article>`;}

    return `<div class="source-board"><div class="board-heading"><span>${esc(s.sourceLabel||m.sourceLabel||'調べる記録')}</span><small>${s.kind==='evidence'?'根拠になるカードを選ぶ':['rows','filter'].includes(s.kind)?'必要な記録を選ぶ':'ゆっくり読んで大丈夫'}</small></div>${s.kind==='filter'?`<label class="search-label" for="log-query">ログの検索 <small>検索語を変えると選択はリセットされます</small></label><div class="searchbox">${icon('search')}<input id="log-query" type="search" maxlength="160" value="${esc(input.query||'')}" placeholder="例：host=pc-name" ${locked()?'disabled':''}><button class="icon-btn" data-action="clear-search" aria-label="検索を消す" ${locked()?'disabled':''}>${icon('close')}</button></div><p id="filter-count" class="filter-count">${filteredRows().length} / ${s.rows.length} 件表示</p>`:''}<div id="source-items" class="source-items">${renderSourceItems()}</div>${['rows','filter','evidence'].includes(s.kind)?`<p class="selected-count" id="selected-count">${(input.rowIds||[]).length}件選択中。もう一度押すと選択を外せます。</p>`:''}</div>`;
  }
  function answerControls(){const s=step(),input=record().input;
    if(s.kind==='text')return `<label class="answer-label" for="answer-text">見つけた答え<input id="answer-text" type="text" value="${esc(input.text||'')}" maxlength="240" placeholder="ログに書かれた値を入力" autocomplete="off" spellcheck="false"></label>`;
    if(s.kind==='choice')return `<fieldset class="choices"><legend class="sr-only">答えを1つ選んでください</legend>${s.choices.map(c=>`<label class="choice"><input type="radio" name="answer-choice" value="${esc(c.id)}" ${input.choiceId===c.id?'checked':''}><span>${esc(c.label)}</span></label>`).join('')}</fieldset>`;
    if(s.kind==='report')return `<div class="report-parts">${[['fact','確認できた事実'],['limit','まだ分からないこと・判断の範囲'],['next','次の対応']].map(([group,label],index)=>`<fieldset class="choices"><legend><span>${index+1}</span>${label}</legend>${s.choices.filter(c=>c.group===group).map(c=>`<label class="choice"><input type="radio" name="part-${group}" data-part="${group}" value="${esc(c.id)}" ${input.parts?.[group]===c.id?'checked':''}><span>${esc(c.label)}</span></label>`).join('')}</fieldset>`).join('')}</div>`;
    return `<div id="answer-summary" class="answer-summary">${answerSummary()}</div>`;
  }
  function graduationReport(){return mission().kind==='investigation'&&record().stage===mission().steps.length-1&&step().kind==='report';}
  function reportText(){const s=step(),parts=record().input.parts||{};return ['fact','limit','next'].map(group=>s.choices.find(c=>c.group===group&&c.id===parts[group])?.label||'').filter(Boolean).join('');}
  function renderReportPreview(){if(!graduationReport())return '';const complete=['fact','limit','next'].every(group=>record().input.parts?.[group]),passed=record().feedback?.passed;return `<section id="report-preview" class="report-preview" aria-label="報告文のプレビュー"><h3>報告文のプレビュー${passed?'':'（下書き）'}</h3><p class="report-preview-text">${complete?esc(reportText()):'3つの文を選ぶと、つながった報告文をここで確認できます。'}</p><p class="small">${passed?'この報告文をテキストファイルとして保存できます。':'選択した文をそのまま表示します。内容を見直してから答え合わせしましょう。'}</p><button class="btn full" data-action="export-report" ${passed?'':'disabled'}>報告文を保存（.txt）</button></section>`;}
  function refreshReportPreview(){const preview=$('report-preview');if(preview)preview.outerHTML=renderReportPreview();}
  function exportReport(){if(!graduationReport()||!record().feedback?.passed)return;download('socroom-easy-'+mission().id+'-report.txt',mission().title+'\n\n'+reportText()+'\n','text/plain;charset=utf-8');notify('卒業調査の報告文を保存しました。');}
  function answerSummary(){const s=step(),input=record().input;if(s.kind==='token')return input.tokenId?'選んだ部分：'+esc(s.tokens.find(t=>t.id===input.tokenId)?.label):'「調べるログ」から、答えになる部分を1つ選んでください。';if(s.kind==='order')return 'ログを並べ替えたら、下のボタンで確認しましょう。';return `${(input.rowIds||[]).length}件を選択中。${s.kind==='filter'?'検索してから、答えになる記録を選んでください。':'答えになる記録の「この記録を選ぶ」を押してください。'}`;}
  function readyInput(){const s=step(),i=record().input;if(locked())return false;if(s.kind==='text')return Boolean(i.text?.trim());if(s.kind==='token')return Boolean(i.tokenId);if(s.kind==='choice')return Boolean(i.choiceId);if(s.kind==='report')return ['fact','limit','next'].every(k=>Boolean(i.parts?.[k]));if(s.kind==='order')return true;return Boolean(i.rowIds?.length)&&(s.kind!=='filter'||Boolean(i.query?.trim()));}
  function renderFeedback(){const r=record(),m=mission(),s=step(),f=r.feedback;if(!f)return '';const more=m.kind==='investigation'&&r.stage<m.steps.length-1,complete=f.passed&&!more,next=nextMission(m);return `<section class="feedback ${f.passed?'success':'try-again'}" id="feedback" tabindex="-1" aria-label="答え合わせ"><span class="feedback-kicker">${f.passed?(complete?'FLAG CAPTURED':'STEP CLEAR'):'TRY AGAIN'}</span><h3>${f.passed?(complete?'見つけた！フラグ獲得。':'この作業はできました。'):'もう一度、手がかりを見てみよう。'}</h3><p>${esc(f.message)}</p>${f.passed?`${f.message!==s.answerExplanation?`<p class="why-answer">${esc(s.answerExplanation)}</p>`:''}${complete?`<code class="earned-flag">${esc(m.flag)}</code><p class="point-note">この課題は100ポイント。何度解いても重複加算されません。</p>`:''}<button class="btn primary full next-step" data-action="${more?'advance':next?'next':'finish'}">${more?'次の作業へ':next?'次の課題へ':level().title+'の学習マップへ'} ${icon('arrow')}</button>${complete?`<div class="bridge-mini"><strong>SOCroomではここにつながる</strong><span>${esc(m.bridge.tool)}</span><p>${esc(m.bridge.how)}</p></div><button class="text-button" data-action="retry">もう一度、自分で解く</button>`:''}`:'<p class="small">間違えても減点はありません。ヒントも使えます。</p>'}</section>`;}
  function renderHints(){const r=record(),s=step(),n=r.attemptHintCounts?.[r.stage]||0,revealed=r.attemptRevealedStages?.includes(r.stage);return `<section class="hint-card" aria-label="学習のヒント"><div class="hint-heading">${icon('help')}<h3>迷ったら、ここから。</h3></div><p>ヒントを使っても、ポイントは減りません。</p>${(s.hints||[]).slice(0,n).map((h,i)=>`<div class="hint"><span>ヒント ${i+1}</span><p>${esc(h)}</p></div>`).join('')}<button class="btn full" data-action="hint" ${n>=(s.hints||[]).length?'disabled':''}>${n?'次のヒントを見る':'最初のヒントを見る'} <span>${n} / ${(s.hints||[]).length}</span></button>${revealed?`<div class="solution"><h4>答えと、その読み方</h4><p>${esc(s.solution)}</p><small>解説を見ただけではクリアになりません。課題で実際に操作してみましょう。</small></div>`:`<button class="text-button full" data-action="solution">答えと読み方を見て学ぶ</button>`}</section>`;}
  function renderMission(){const m=mission(),r=record(),s=step(),chapter=chapterFor(m),investigation=m.kind==='investigation';$('app').innerHTML=header()+`<main class="lesson-page" id="main"><div class="lesson-breadcrumb"><button class="text-button" data-action="map">← 学習マップ</button><span>${esc(level().title)} · ${String(chapterIndex(m)).padStart(2,'0')} / ${esc(chapter.title)}</span><span class="lesson-position">${missionIndex(m)} / ${levelMissions().length}</span></div><header class="lesson-title"><div><p class="eyebrow">${investigation?'FINAL MISSION':'SMALL STEP / BIG DISCOVERY'}</p><h1>${esc(m.title)}</h1><p>${esc(m.brief)}</p></div><div class="mission-reward">${icon('flag')}<span>クリアで<strong>100 pt</strong></span></div></header>${investigation?`<div class="investigation-steps" aria-label="ミニ調査の進み具合">${m.steps.map((st,index)=>`<div class="${index===r.stage?'current':index<r.stage?'done':''}"><span>${index<r.stage?'✓':index+1}</span><p>${esc(st.title)}</p></div>`).join('')}</div>`:''}<section class="mobile-task"><span>今回のミッション</span><p>${esc(s.task)}</p></section><div class="lesson-layout ${s.kind==='report'?'report-layout':''}"><div class="learning-column"><section class="learn-card"><div class="learn-heading"><span>${icon('book')}</span><div><small>まずは、ここだけ</small><h2>${esc(m.skill)}</h2></div><button class="text-button" data-action="glossary">用語帳</button></div>${m.learn.map(p=>`<p>${esc(p)}</p>`).join('')}<details class="worked-example"><summary>${esc(m.example.title||'別の例で見てみる')}</summary><p>${esc(m.example.text)}</p></details></section>${investigation?`<div class="stage-heading"><span>作業 ${r.stage+1} / ${m.steps.length}</span><h2>${esc(s.title)}</h2></div>`:''}${renderSource()}<div class="reading-note">${icon('book')}ログはシステムが残した記録です。ここにあるのは練習用の架空データです。</div></div><aside class="task-column"><section class="task-card"><div class="task-label"><span class="task-dot"></span>今回のミッション</div><h2 id="task-heading">${esc(s.task)}</h2><form id="answer-form" aria-labelledby="task-heading"><fieldset class="answer-fields" ${locked()?'disabled':''}>${answerControls()}</fieldset><button class="btn primary full submit-answer" id="submit-answer" type="submit" ${!readyInput()?'disabled':''}>${icon('check')}答え合わせ</button></form><p class="answer-help">${locked()?'結果を読んで、次へ進みましょう。':'見つけた答えを選ぶ・入力すると、答え合わせができます。'}</p></section>${renderReportPreview()}${renderFeedback()}${renderHints()}${r.completed&&!r.feedback?.passed?'<div class="review-note">この課題のフラグは獲得済みです。復習の間違いで消えることはありません。</div>':''}</aside></div></main>`+footer();}
  function render(){const active=document.activeElement,activeId=active?.id,attrs=['data-level','data-open','data-token','data-select','data-move','data-action'],attr=attrs.find(a=>active?.hasAttribute?.(a)),value=attr?active.getAttribute(attr):null,direction=active?.dataset.direction;screen==='map'?renderMap():renderMission();let restore=activeId?$(activeId):null;if(!restore&&attr)restore=Array.from($('app').querySelectorAll(`[${attr}]`)).find(el=>el.getAttribute(attr)===value&&(!direction||el.dataset.direction===direction));if(restore&&!restore.disabled)restore.focus({preventScroll:true});}
  function openMission(id){try{E.openMission(progress,id);screen='mission';save();render();window.scrollTo?.({top:0,behavior:'instant'});document.querySelector('.lesson-title h1')?.setAttribute('tabindex','-1');document.querySelector('.lesson-title h1')?.focus({preventScroll:true});announce(mission().title+'。'+step().task);}catch(error){notify(error.message);}}
  function updateAnswerState(){refreshReportPreview();if(!record().feedback)$('feedback')?.remove();const submit=$('submit-answer');if(submit)submit.disabled=!readyInput();const summary=$('answer-summary');if(summary)summary.innerHTML=answerSummary();const selected=$('selected-count');if(selected)selected.textContent=`${(record().input.rowIds||[]).length}件選択中。もう一度押すと選択を外せます。`;}
  function setInput(patch,rerender=false){if(locked())return;if('query' in patch&&normalize(patch.query)!==normalize(record().input.query))patch={...patch,rowIds:[]};try{E.setInput(progress,progress.currentId,patch);save();if(rerender)render();else updateAnswerState();}catch(error){notify(error.message);}}
  function showGlossary(){modal('用語をひとつずつ',`<p class="glossary-intro">全部覚えてから始めなくて大丈夫。出てきた言葉を、ここで確かめましょう。</p><dl class="glossary">${D.glossary.map(g=>`<div><dt>${esc(g.term)}</dt><dd>${esc(g.meaning)}${g.example?`<code>${esc(g.example)}</code>`:''}</dd></div>`).join('')}</dl>`);}
  function showCollection(){const complete=levelMissions().filter(m=>progress.records[m.id].completed);modal(level().title+'で集めたフラグ',complete.length?`<p>${complete.length} / ${levelMissions().length} の小さな発見が集まりました。</p><div class="flag-collection">${complete.map(m=>`<article><strong>${icon('flag')} ${esc(m.title)}</strong><code>${esc(m.flag)}</code><span>${statusLabel(progress.records[m.id],true)}</span></article>`).join('')}</div>`:'<p>まだフラグはありません。最初の課題から、小さな発見を集めましょう。</p>');}
  const actions={
    map:()=>{screen='map';save(true);render();window.scrollTo?.({top:0,behavior:'instant'});},
    glossary:showGlossary,collection:showCollection,export:exportSave,'export-report':exportReport,import:()=>{$('import-file').value='';$('import-file').click();},close:closeModal,
    hint:()=>{try{E.revealHint(progress,progress.currentId);save();render();announce('ヒントを表示しました。'+(step().hints[(record().attemptHintCounts?.[record().stage]||1)-1]||''));}catch(error){notify(error.message);}},
    solution:()=>{E.revealSolution(progress,progress.currentId);save();render();document.querySelector('.solution')?.scrollIntoView?.({block:'nearest'});announce('答えと読み方を表示しました。');},
    advance:()=>{E.advanceStep(progress,progress.currentId);save();render();$('task-heading')?.scrollIntoView?.({block:'center'});announce(step().title+'。'+step().task);},
    next:()=>{const next=nextMission(mission());if(next)openMission(next.id);},
    finish:()=>{screen='map';save(true);render();document.querySelector('.bridge-card')?.scrollIntoView?.({block:'center'});announce(level().title+'の21問を体験しました。次の練習への進み方を表示しています。');},
    retry:()=>{E.retry(progress,progress.currentId);save();render();announce('ヒントと解説を閉じて、もう一度取り組めます。過去の利用履歴とフラグは保持しています。');},
    'clear-search':()=>{setInput({query:''},true);$('log-query')?.focus();},
    reset:()=>modal('学習の記録を最初からにする',`<p>全3級のフラグ・下書き・ヒントの記録を消します。必要なら先に保存ファイルを取り出してください。SOCroomの進捗には影響しません。</p>`,`<button class="btn" data-action="export">進捗を保存</button><button class="btn" data-action="close">戻る</button><button class="btn danger" data-action="reset-confirmed">記録を消して始め直す</button>`),
    'reset-confirmed':()=>{closeModal();progress=E.createProgress();screen='map';save(true);render();notify('SOCroom-easyの記録を初期化しました。');},
    'import-confirmed':()=>{if(!pendingImport)return;const next=pendingImport;closeModal();progress=next;screen='map';save(true);render();notify('進捗を読み込みました。続きから練習できます。');}
  };
  document.addEventListener('click',event=>{const el=event.target.closest('button,[data-action]');if(!el||el.disabled)return;try{if(el.dataset.action){event.preventDefault();actions[el.dataset.action]?.();}else if(el.dataset.level)selectLevel(el.dataset.level);else if(el.dataset.open)openMission(el.dataset.open);else if(el.dataset.token)setInput({tokenId:el.dataset.token},true);else if(el.dataset.select){const ids=record().input.rowIds||[],id=el.dataset.select;setInput({rowIds:ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]},true);}else if(el.dataset.move){const ids=[...(record().input.orderIds||step().rows.map(r=>r.id))],index=ids.indexOf(el.dataset.move),other=index+Number(el.dataset.direction);if(other>=0&&other<ids.length){[ids[index],ids[other]]=[ids[other],ids[index]];setInput({orderIds:ids},true);}}}catch(error){notify(error.message);}});
  document.addEventListener('input',event=>{const el=event.target;if(el.id==='answer-text')setInput({text:el.value});else if(el.id==='log-query'){setInput({query:el.value});if(!composing&&!event.isComposing)refreshSearch();}});
  function refreshSearch(){if($('source-items'))$('source-items').innerHTML=renderSourceItems();if($('filter-count'))$('filter-count').textContent=`${filteredRows().length} / ${step().rows.length} 件表示`;}
  document.addEventListener('compositionstart',()=>{composing=true;});
  document.addEventListener('compositionend',event=>{composing=false;if(event.target.id==='log-query'){setInput({query:event.target.value});refreshSearch();}else if(event.target.id==='answer-text')setInput({text:event.target.value});});
  document.addEventListener('change',event=>{const el=event.target;if(el.name==='answer-choice')setInput({choiceId:el.value});else if(el.dataset.part)setInput({parts:{...(record().input.parts||{}),[el.dataset.part]:el.value}});});
  document.addEventListener('submit',event=>{if(event.target.id!=='answer-form')return;event.preventDefault();if(!readyInput())return;try{const result=E.submit(progress,progress.currentId);save(true);render();$('feedback')?.focus({preventScroll:true});$('feedback')?.scrollIntoView?.({block:'nearest'});announce((result.passed?'正解です。':'もう一度見てみましょう。')+result.message);}catch(error){notify(error.message);}});
  $('import-file').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;if(file.size>2*1024*1024)return notify('2MB以下のSOCroom-easy保存ファイルを選んでください。');try{const raw=JSON.parse(await file.text());if(raw.format!=='socroom-easy-save'||![1,2].includes(raw.version))throw new Error('SOCroom-easyの保存ファイルではありません。');const next=E.hydrate(raw),stats=E.stats(next);pendingImport=next;modal('保存した学習を読み込む',`<p>このファイルには <strong>${stats.completed} / ${stats.total} フラグ</strong>の記録があります。</p><p>全3級の学習記録をこのファイルで置き換えます。必要なら先に現在の進捗を保存してください。</p>${raw.version===1?'<p class="import-legacy-note">初版の進捗は初級へ引き継ぎます。このファイルには中級・上級の記録がないため、その2級は未着手になります。</p>':''}`,`<button class="btn" data-action="export">現在の進捗を保存</button><button class="btn" data-action="close">戻る</button><button class="btn primary" data-action="import-confirmed">読み込む</button>`);}catch(error){notify('読み込めませんでした：'+error.message);}});
  $('dialog').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
  window.addEventListener('pagehide',()=>save(true));
  render();if(restoreWarning)notify(restoreWarning);if(storageOK)save(true);
})();
</script>
</body>
